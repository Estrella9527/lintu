[project]
name = "lintu-sidecar"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "google-generativeai",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "imagehash>=4.3",
    "jieba>=0.42",
    "numpy>=2.4.4",
    "openpyxl>=3.1",
    "oss2>=2.18",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30.0",
    # PostgreSQL drivers — only required in cloud (LINTU_MODE=server) but
    # always installed because the wheels are tiny and lets us swap DB at
    # runtime via LINTU_DB_URL without a separate build.
    "asyncpg>=0.30",                 # async runtime
    "psycopg[binary]>=3.2",          # sync, used by Alembic migrations
]

[project.optional-dependencies]
# Local CLIP fallback for image embedding when no API provider is configured.
# Pulls torch + open_clip + scipy + ~1.5GB of NVIDIA CUDA wheels — opt in only
# for desktop/dev: `uv sync --extra local-clip`. The cloud Docker image
# intentionally excludes this group; cloud uses API embedding (Doubao Ark) and
# only RECEIVES pre-computed embeddings via /internal/sync/images.
local-clip = [
    "torch>=2.3",
    "open-clip-torch>=2.24",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
