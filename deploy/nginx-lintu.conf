# 灵图云端 sidecar — nginx server block
# 部署位置：/etc/nginx/sites-available/lintu，并 ln -sf 到 sites-enabled
# 与同主机的其他站点（如 zhongming-api）按 server_name 隔离，互不影响。
#
# 部署流程（两步）：
#   1) 先只放 listen 80 段，让 certbot 验 ACME：
#        sudo certbot --nginx -d api.example.com
#      certbot 会自动改这个文件加 SSL 配置和 redirect
#   2) 然后用本完整文件覆盖（保留 certbot 写入的 cert 路径），加上 internal
#      allowlist + 安全头，再 sudo nginx -t && sudo systemctl reload nginx

upstream lintu_sidecar {
    server 127.0.0.1:17879;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # 由 certbot 自动管理（首次申请后这两行已生成，请勿手改路径）
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # UGC 上传走直传 OSS 不经过 sidecar；这里只用兜文档导入等小请求
    client_max_body_size 50m;

    # 内部 sync 端点：仅放行运营 macOS 出口公网 IP
    # 路径前缀 /internal/ 自动覆盖 /internal/sync/* 所有子路径
    # IP 不固定时改用 SSH 隧道方案：保持 deny all + 本机 autossh
    location /internal/ {
        # TODO: 部署时替换成 macOS 当前出口公网 IP（curl ifconfig.me）
        allow REPLACE_WITH_MACOS_PUBLIC_IP;
        deny all;

        proxy_pass         http://lintu_sidecar;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 300s;
    }

    # 公开 OpenAPI（UGC 调匹配走这里，鉴权由 sidecar 中间件做）
    location / {
        proxy_pass         http://lintu_sidecar;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / 长连接：禁缓冲，超时拉长
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
