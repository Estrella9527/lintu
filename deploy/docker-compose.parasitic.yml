# 灵图 Sidecar — 寄生部署版（与原 docker-compose.yml 并存）
#
# 适用场景：同台 ECS 已运行其他项目（如 zhongming），且**已有 host PG 实例**
# 在 5432 端口跑（与 dataagent / geo_ai_platform 共用），lintu 用户/库 + pgvector
# 等扩展由 phase 4 init 脚本预先建好。
#
# 本配置：
#   - 不起新 PG 容器，sidecar 直接连 host PG 的 127.0.0.1:5432
#   - sidecar 用 host network（避开 bridge 段冲突 172.17/172.18 已占）
#   - sidecar 监听 127.0.0.1:17879（公网无法直连，只能通过主机 nginx 反代）
#
# 前置条件（phase 4 应该已经满足）：
#   - host PG 17 在 127.0.0.1:5432 listening
#   - lintu 用户存在，密码已生成保存于 ~/.lintu_db_password
#   - lintu 数据库已建，extensions 已装（vector/pg_trgm/pgcrypto/unaccent/btree_gin）
#   - 验证：PGPASSWORD=... psql -h 127.0.0.1 -U lintu -d lintu -c '\dx'
#
# Usage:
#   cd /srv/lintu/deploy
#   docker compose -f docker-compose.parasitic.yml up -d
#   docker compose -f docker-compose.parasitic.yml ps
#   docker compose -f docker-compose.parasitic.yml logs -f sidecar

services:
  sidecar:
    build:
      context: ../apps/sidecar
      dockerfile: Dockerfile
    image: lintu-sidecar:0.2
    container_name: lintu-sidecar
    restart: unless-stopped
    network_mode: host
    # 覆盖 Dockerfile 默认 CMD（--host 0.0.0.0 --port 7879）：
    # 锁 loopback + 改 17879，公网只能通过主机 nginx 反代进入
    command:
      - uv
      - run
      - uvicorn
      - sidecar.main:app
      - --host
      - 127.0.0.1
      - --port
      - "17879"
    volumes:
      - ./data:/data
    environment:
      LINTU_MODE: server
      LINTU_PORT: "17879"
      LINTU_DATA_DIR: /data
      # host network 模式：通过 127.0.0.1 直连 host PG（17.9 with pgvector 0.8.2）
      # 库/用户/扩展由 phase 4 init 脚本预建。
      LINTU_DB_URL: "postgresql+asyncpg://${POSTGRES_USER:-lintu}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-lintu}"
      LINTU_INTERNAL_SYNC_TOKEN: "${LINTU_INTERNAL_SYNC_TOKEN:?required}"
      LINTU_ALLOW_CORS: "${LINTU_ALLOW_CORS:-}"
      LINTU_AUDIT_BODY: "${LINTU_AUDIT_BODY:-0}"
      LINTU_DEFAULT_IMAGE_EMBEDDING_PROVIDER: "${LINTU_DEFAULT_IMAGE_EMBEDDING_PROVIDER:-}"
      LINTU_CUSTOM_RELAYS: "${LINTU_CUSTOM_RELAYS:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:17879/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
