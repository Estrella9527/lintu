name: Build installers (Windows + macOS)

# Triggers:
#   - manual run from the Actions tab
#   - any tag matching v*  (auto-build on a release tag)
#   - push to default branch v0.2 that touches build-relevant paths
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["v0.2"]
    paths:
      - "apps/electron/**"
      - "apps/sidecar/**"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: write   # needed only for the optional release step on tag push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: lintu-windows-x64
            update_yml: latest.yml
            oss_path: windows
          - os: macos-latest
            platform: mac
            artifact_name: lintu-macos-arm64
            update_yml: latest-mac.yml
            oss_path: mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ── Sidecar (Python) ──────────────────────────────────────────────────
      - name: Sync sidecar deps
        working-directory: apps/sidecar
        run: uv sync

      - name: Add PyInstaller
        working-directory: apps/sidecar
        run: uv add --dev pyinstaller

      - name: Build sidecar with PyInstaller
        working-directory: apps/sidecar
        run: uv run pyinstaller sidecar.spec --noconfirm --clean

      - name: Verify sidecar binary exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f apps/sidecar/dist/sidecar/sidecar.exe || (echo "Missing sidecar.exe" && exit 1)
            ls -la apps/sidecar/dist/sidecar/sidecar.exe
          else
            test -f apps/sidecar/dist/sidecar/sidecar || (echo "Missing sidecar" && exit 1)
            chmod +x apps/sidecar/dist/sidecar/sidecar
            ls -la apps/sidecar/dist/sidecar/sidecar
          fi

      # ── Electron (Node) ───────────────────────────────────────────────────
      - name: Install npm deps
        # npm has a long-standing bug with platform-specific optional deps in
        # cross-platform lockfiles (https://github.com/npm/cli/issues/4828).
        # Our package-lock.json is generated on Windows so it lacks
        # @rollup/rollup-darwin-arm64; vite then crashes on macOS at build
        # time with MODULE_NOT_FOUND. Workaround: ignore the lockfile in CI
        # (--no-package-lock). Local dev still uses the lockfile via
        # `npm install` from a project root.
        shell: bash
        run: npm install --no-fund --no-audit --no-package-lock

      - name: Bundle main / preload / renderer
        working-directory: apps/electron
        shell: bash
        env:
          # user 版烤入 SMS 凭据（让客户机零配置就能发短信）。dev / ops 不烤。
          # build-main.mjs 在 flavor !== 'user' 时会忽略这些 env，所以 ops/dev
          # 跑 CI 也不会泄漏凭据到打包里。
          LINTU_BUILD_FLAVOR: user
          BAKED_SMS_ACCESS_KEY:    ${{ secrets.LINTU_SMS_ACCESS_KEY }}
          BAKED_SMS_ACCESS_SECRET: ${{ secrets.LINTU_SMS_ACCESS_SECRET }}
          BAKED_SMS_SIGN_NAME:     ${{ secrets.LINTU_SMS_SIGN_NAME }}
          BAKED_SMS_TEMPLATE_CODE: ${{ secrets.LINTU_SMS_TEMPLATE_CODE }}
        run: |
          # 用 build-main.mjs 而不是直接 npx esbuild — 让 --define 注入逻辑
          # 集中在一个脚本里（包括 BUILD_FLAVOR + BAKED_SMS_*）。
          node scripts/build-main.mjs
          npx esbuild src/preload/index.ts --bundle --platform=node --format=cjs --outfile=dist/preload.cjs --external:electron
          npx vite build --config vite.config.ts

      # ── Decode signing certificate (per-platform) ─────────────────────────
      # Windows .pfx and macOS .p12 are both PKCS#12 — we decode either one
      # the same way. The Windows secret holds a self-signed cert we made
      # locally; the macOS secret holds the Apple Developer ID Application
      # certificate exported from Keychain.
      - name: Decode code-signing certificate
        id: sign-setup
        if: |
          (matrix.platform == 'win' && env.WIN_CSC_BASE64 != '') ||
          (matrix.platform == 'mac' && env.MAC_CSC_BASE64 != '')
        shell: bash
        env:
          WIN_CSC_BASE64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
          MAC_CSC_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            ext=pfx
            content="$WIN_CSC_BASE64"
          else
            ext=p12
            content="$MAC_CSC_BASE64"
          fi
          path="$RUNNER_TEMP/codesign.$ext"
          echo "$content" | base64 --decode > "$path"
          echo "csc_link=$path" >> "$GITHUB_OUTPUT"
          echo "Code-signing cert decoded ($ext) to $path"

      # ── Build installer (electron-builder) ────────────────────────────────
      - name: Build installer
        working-directory: apps/electron
        env:
          # PFX/P12 path + password — same env names work for both platforms.
          CSC_LINK:         ${{ steps.sign-setup.outputs.csc_link }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CODESIGN_PFX_PASSWORD || secrets.MAC_CODESIGN_P12_PASSWORD }}

          # macOS notarization (ignored on Windows).
          # electron-builder reads these to call Apple's notary service after
          # signing. App-specific password generated at appleid.apple.com.
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --x64 --config electron-builder.yml --publish never
          else
            # macOS notarization requires APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
            # + APPLE_TEAM_ID. If any of those secrets is empty (i.e. user
            # hasn't registered Apple Developer yet), produce an unsigned
            # build instead of failing the whole job.
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::warning::APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID not set — building unsigned + un-notarized macOS artifact (Gatekeeper will block on end-user Macs)"
              npx electron-builder --mac --arm64 --config electron-builder.yml --publish never \
                -c.mac.notarize=false -c.mac.identity=null
            else
              npx electron-builder --mac --arm64 --config electron-builder.yml --publish never
            fi
          fi

      - name: List release artifacts
        shell: bash
        working-directory: apps/electron
        run: ls -la release/ || true

      # ── Verify signature (only when we actually signed) ───────────────────
      # For self-signed certs the runner returns Status=UnknownError because
      # the cert isn't in its trust store — the signing itself is fine. Real
      # failures are NotSigned / HashMismatch (file tampered or signtool
      # silently no-op'd). Validate by checking the SignerCertificate exists
      # and matches our subject; promote to a strict "Valid" check once we
      # switch to a CA-issued (EV) cert.
      - name: Verify Windows signature
        if: matrix.platform == 'win' && steps.sign-setup.outputs.csc_link != ''
        shell: pwsh
        run: |
          $files = @(
            "apps/electron/release/win-unpacked/灵图.exe",
            "apps/electron/release/win-unpacked/resources/sidecar/sidecar.exe"
          )
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "<none>" }
            Write-Host "${f}: Status=$($sig.Status) | Signer=$signer"
            if ($sig.Status -eq "NotSigned" -or $sig.Status -eq "HashMismatch") {
              throw "Signature check failed for ${f}: $($sig.Status)"
            }
            if ($sig.SignerCertificate -eq $null) {
              throw "No signer certificate on ${f}"
            }
            if (-not $sig.SignerCertificate.Subject.Contains("Longchan Tech")) {
              throw "Wrong signer subject for ${f}: $signer"
            }
          }

      - name: Verify macOS signature + notarization
        if: matrix.platform == 'mac' && steps.sign-setup.outputs.csc_link != '' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        shell: bash
        working-directory: apps/electron
        run: |
          dmg=$(ls release/灵图-*-arm64.dmg | head -1)
          echo "Verifying: $dmg"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/灵图.app"
          spctl --assess --type execute --verbose=2 "release/mac-arm64/灵图.app" || true
          # stapler verifies the notarization ticket is attached to the dmg
          xcrun stapler validate "$dmg"

      # ── Upload artifacts (always, on every successful build) ──────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/electron/release/灵图-*
            apps/electron/release/${{ matrix.update_yml }}
            apps/electron/release/builder-debug.yml
          retention-days: 30
          if-no-files-found: error

      # ── Publish to Aliyun OSS (only on tag push: v*) ─────────────────────
      # Cross-platform via the oss2 Python SDK rather than the ossutil CLI.
      # ossutil 1.x has no native macOS-arm64 build, and 2.x distributes as
      # zip with platform-specific archive names — both add fragile shell
      # plumbing. Python is already set up by an earlier step on both OSes;
      # using oss2 keeps this step ~10 lines and identical between Win/Mac.
      - name: Publish to Aliyun OSS
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          OSS_KEY:           ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_SECRET:        ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET:        ${{ secrets.ALIYUN_OSS_BUCKET }}
          OSS_ENDPOINT:      ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_PATH:          ${{ matrix.oss_path }}
          UPDATE_YML:        ${{ matrix.update_yml }}
          # Force UTF-8 for stdout/stderr — file names contain "灵图" and
          # Windows Python defaults to cp1252 which can't encode them.
          PYTHONIOENCODING:  utf-8
          PYTHONUTF8:        "1"
        working-directory: apps/electron
        run: |
          python -m pip install --quiet "oss2>=2.18"
          python <<'PY'
          import glob, os, sys
          import oss2

          bucket_name = os.environ.get("OSS_BUCKET") or "lintu-releases"
          endpoint    = os.environ.get("OSS_ENDPOINT") or "oss-cn-hangzhou.aliyuncs.com"
          oss_path    = os.environ["OSS_PATH"]            # "windows" or "mac"
          update_yml  = os.environ["UPDATE_YML"]          # "latest.yml" or "latest-mac.yml"

          auth   = oss2.Auth(os.environ["OSS_KEY"], os.environ["OSS_SECRET"])
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          # Match installer + blockmap + the platform's update yml. Glob is
          # fine; release/ is a clean output dir produced this run only.
          targets = sorted(set(glob.glob("release/灵图-*"))) + [f"release/{update_yml}"]
          public_read = {"x-oss-object-acl": "public-read"}

          uploaded = []
          for path in targets:
              if not os.path.isfile(path):
                  print(f"  skip (missing): {path}")
                  continue
              key = f"{oss_path}/{os.path.basename(path)}"
              size_mb = os.path.getsize(path) / 1024 / 1024
              print(f"  uploading {key} ({size_mb:.1f} MB)")
              bucket.put_object_from_file(key, path, headers=public_read)
              uploaded.append(key)

          if not uploaded:
              print("nothing uploaded — refusing to silently succeed", file=sys.stderr)
              sys.exit(1)

          print(f"\n✓ {len(uploaded)} file(s) live at oss://{bucket_name}/{oss_path}/")
          PY

  # ── Aggregate release on tag push ───────────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lintu-windows-x64/*
            artifacts/lintu-macos-arm64/*
          fail_on_unmatched_files: true
          generate_release_notes: true
